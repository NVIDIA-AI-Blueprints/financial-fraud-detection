name: Financial Fraud Detection Notebook Runner

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_image:
        description: "blueprint-github-test image that runs the QA tests"
        required: false
        default: nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TEST_IMAGE: ${{ inputs.test_image || 'nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest' }}
  CONDA_ENV_NAME: fraud_blueprint_env
  NOTEBOOK: financial-fraud-usage-link-prediction.ipynb
  RESULT_NAME: Financial-Fraud-Detection_result
  QA_PYTEST_MARK: financial_fraud_detection
  QA_PYTEST_FILE: testcases/test_financial_fraud_detection_notebook.py

jobs:
  run-notebook:
    runs-on: arc-runners-org-nvidia-ai-bp-1-gpu
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Check System Info
        run: |
          echo "===================== System Info ====================="
          more /etc/os-release
          uname -a
          docker version
          nvidia-smi || true

      - name: Pull test image
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TEST_DOCKER_PULL_KEY:-}" ]; then
            echo "::error::repository secret TEST_DOCKER_PULL_KEY is not set"
            exit 1
          fi
          echo "${TEST_DOCKER_PULL_KEY}" | docker login nvcr.io --username '$oauthtoken' --password-stdin
          docker pull "${TEST_IMAGE}"

      - name: Download TabFormer data
        run: |
          set -euo pipefail
          DL="${RUNNER_TEMP}/tabformer"
          mkdir -p "${DL}"
          docker run --rm \
            -v "${DL}:/work" \
            -w /work \
            "${TEST_IMAGE}" \
            python /app/utils/financial_fraud_detection_download_box_file.py
          TGZ="${DL}/downloads/extracted/credit_card/transactions.tgz"
          test -s "${TGZ}" || { echo "::error::transactions.tgz was not downloaded"; exit 1; }
          cp "${TGZ}" data/TabFormer/raw/transactions.tgz
          ls -lh data/TabFormer/raw

      - name: Create conda environment
        run: |
          set -euo pipefail
          MF="${RUNNER_TEMP}/miniforge"
          curl -fsSL -o "${RUNNER_TEMP}/miniforge.sh" \
            "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-$(uname)-$(uname -m).sh"
          bash "${RUNNER_TEMP}/miniforge.sh" -b -p "${MF}"
          "${MF}/bin/mamba" env create -y -f conda/notebook_env.yaml
          echo "${MF}/bin" >> "${GITHUB_PATH}"

      - name: Docker login to NGC
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NGC_API_KEY:-}" ]; then
            echo "::error::repository secret NGC_API_KEY is not set"
            exit 1
          fi
          echo "${NGC_API_KEY}" | docker login nvcr.io --username '$oauthtoken' --password-stdin

      - name: Read NGC API key from the environment
        working-directory: notebooks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          path = os.environ["NOTEBOOK"]
          nb = json.load(open(path, encoding="utf-8"))
          old = 'API_KEY="NGC API KEY"'
          new = 'API_KEY=os.environ["NGC_API_KEY"]'
          hits = 0
          for cell in nb["cells"]:
              src = "".join(cell.get("source", []))
              if cell.get("cell_type") == "code" and old in src:
                  cell["source"] = src.replace(old, new)
                  hits += 1
          if hits == 0:
              raise SystemExit(f"{old} not found in {path}")
          json.dump(nb, open(path, "w", encoding="utf-8"), indent=1, ensure_ascii=False)
          print(f"replaced API_KEY in {hits} cell(s)")
          PY

      - name: Execute notebook
        working-directory: notebooks
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        run: |
          set -euo pipefail
          conda run --no-capture-output -n "${CONDA_ENV_NAME}" \
            jupyter nbconvert --to notebook --execute --allow-errors \
              --ExecutePreprocessor.kernel_name=python3 \
              --output "${RESULT_NAME}.ipynb" "${NOTEBOOK}"
          conda run --no-capture-output -n "${CONDA_ENV_NAME}" \
            jupyter nbconvert --to html --output "${RESULT_NAME}.html" "${RESULT_NAME}.ipynb"
          test -s "${RESULT_NAME}.html"

      - name: Run QA tests
        working-directory: notebooks
        run: |
          set -euo pipefail
          test -s "${RESULT_NAME}.html" || { echo "::error::${RESULT_NAME}.html missing"; exit 1; }
          docker run --rm \
            -v "$(pwd)/${RESULT_NAME}.html:/app/input/Financial-Fraud-Detection_result.html" \
            -v "$(pwd):/workspace" \
            "${TEST_IMAGE}" \
            pytest "${QA_PYTEST_FILE}" -m "${QA_PYTEST_MARK}" --timeout=900 --disable-warnings \
              --html=/workspace/financial_fraud_detection.html --self-contained-html

      - name: Check notebook cell errors
        if: always()
        working-directory: notebooks
        run: |
          set -euo pipefail
          test -s "${RESULT_NAME}.ipynb" || { echo "::error::${RESULT_NAME}.ipynb missing"; exit 1; }
          python3 - <<'PY'
          import json, os
          nb = json.load(open(os.environ["RESULT_NAME"] + ".ipynb", encoding="utf-8"))
          errors = [
              (i, o.get("ename"), o.get("evalue"))
              for i, c in enumerate(nb["cells"])
              for o in c.get("outputs", [])
              if o.get("output_type") == "error"
          ]
          for i, name, value in errors:
              print(f"::error::cell {i}: {name}: {value}")
          raise SystemExit(1 if errors else 0)
          PY

      - name: Upload notebook results as artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: notebook-results
          path: |
            notebooks/Financial-Fraud-Detection_result.html
            notebooks/Financial-Fraud-Detection_result.ipynb
            notebooks/financial_fraud_detection.html
          retention-days: 30

      - name: Cleanup containers
        if: always()
        run: docker rm -f tritonserver financial-fraud-training_lp 2>/dev/null || true

      - name: Set result output
        id: set_result
        if: always()
        run: |
          echo "RESULT=$(if [ ${{ job.status }} == 'success' ]; then echo 'PASS'; else echo 'FAIL'; fi)" >> $GITHUB_OUTPUT

      - name: Send mail
        uses: dawidd6/action-send-mail@6e71c855c9a091d80a519621b9fd3e8d252ca40c
        if: always()
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "QA Test Workflow Result for ${{ github.repository }}"
          to: Github-Action-Blueprint-QA@nvidia.com
          from: github-workflow-notification@gmail.com
          html_body: |
            <p>Hello,</p>

            <p>The workflow for repository: <strong>${{ github.repository }}</strong> has completed.<br>
            <strong>Result:</strong> ${{ steps.set_result.outputs.RESULT }}</p>

            <p>You can review the details on GitHub:<br>
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</a></p>

            <p>Thanks!</p>
